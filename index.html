<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PasteBin</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0a;color:#ccc;font-family:monospace;padding:20px}
        .w{max-width:900px;margin:0 auto}
        .h{display:flex;justify-content:space-between;padding:12px 16px;background:#111;border:1px solid #222;border-radius:8px;margin-bottom:16px}
        .h .l{font-size:20px;font-weight:700;color:#fff}
        .h .l span{color:#6c5ce7}
        textarea{width:100%;min-height:400px;padding:14px;background:#111;border:1px solid #222;border-radius:8px;color:#e0e0e0;font-family:monospace;font-size:14px;line-height:1.7;resize:vertical;outline:none}
        textarea:focus{border-color:#6c5ce7}
        .tb{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
        .tb button{padding:8px 18px;border:none;border-radius:6px;font-weight:600;font-size:13px;cursor:pointer;font-family:monospace}
        .sv{background:#6c5ce7;color:#fff}
        .sv:hover{background:#5a4bd1}
        .cp{background:#2a2a2a;color:#fff}
        .cp:hover{background:#3a3a3a}
        .dl{background:#00b894;color:#fff}
        .dl:hover{background:#00a381}
        .cl{background:#e74c3c;color:#fff}
        .cl:hover{background:#c0392b}
        .lb{background:#111;border:1px solid #222;border-radius:8px;padding:10px 14px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
        .lb .url{color:#6c5ce7;word-break:break-all;font-size:13px;flex:1}
        .lb button{padding:4px 14px;border:none;border-radius:6px;background:#2a2a2a;color:#fff;cursor:pointer;font-family:monospace}
        .lb button:hover{background:#3a3a3a}
        .fl{max-height:300px;overflow-y:auto;margin-top:12px}
        .it{display:flex;padding:6px 12px;border-bottom:1px solid #1a1a1a;gap:8px;cursor:pointer}
        .it:hover{background:rgba(255,255,255,0.02)}
        .it .id{color:#6c5ce7;min-width:40px}
        .it .nm{flex:1}
        .it .x{cursor:pointer;color:#555}
        .it .x:hover{color:#e74c3c}
        .e{text-align:center;padding:30px;color:#444}
        .toasts{position:fixed;bottom:20px;right:20px;z-index:999}
        .toast{padding:8px 16px;border-radius:6px;font-size:13px;background:#111;border:1px solid #222;margin-top:4px}
        .toast.ok{border-color:#00b894;color:#00b894}
        .toast.err{border-color:#e74c3c;color:#e74c3c}
        .toast.inf{border-color:#6c5ce7;color:#6c5ce7}
    </style>
</head>
<body>
<div class="w">

<div class="h">
    <div class="l">📋 <span>Paste</span></div>
    <div style="color:#555"><b id="t">0</b></div>
</div>

<textarea id="cd" placeholder="Dán code..."></textarea>

<div class="tb">
    <button class="sv" onclick="sv()">💾 Paste</button>
    <button class="cp" onclick="cp()">📋 Copy</button>
    <button class="dl" onclick="dl()">⬇️ DL</button>
    <button class="cl" onclick="cl()">🗑️</button>
</div>

<div id="linkArea" style="display:none">
    <div class="lb">
        <span class="url" id="shareUrl">...</span>
        <button onclick="cs()">Copy</button>
        <button onclick="document.getElementById('linkArea').style.display='none'">✖</button>
    </div>
</div>

<div class="fl" id="fl"><div class="e">📭 Empty</div></div>

</div>
<div class="toasts" id="ts"></div>

<script>
let pastes=[],editId=null;
function ld(){try{const d=localStorage.getItem('p');if(d)pastes=JSON.parse(d)}catch{}r()}
function sd(){localStorage.setItem('p',JSON.stringify(pastes));r()}
function gn(){if(!pastes.length)return 1;const ids=pastes.map(f=>f.id).sort((a,b)=>a-b);let n=1;for(const id of ids){if(id===n)n++;else break}return n}
function r(){const list=document.getElementById('fl');document.getElementById('t').textContent=pastes.length;if(!pastes.length){list.innerHTML='<div class="e">📭 Empty</div>';return}const s=[...pastes].sort((a,b)=>b.id-a.id);list.innerHTML=s.map(f=>`<div class="it" onclick="lf(${f.id})"><span class="id">#${f.id}</span><span class="nm">${esc(f.name||'untitled')}</span><span style="color:#555;font-size:12px">${(f.content||'').length}c</span><span class="x" onclick="event.stopPropagation();df(${f.id})">🗑️</span></div>`).join('')}
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}
function sv(){const c=document.getElementById('cd').value;if(!c.trim()){t('Empty!','err');return}const n=document.getElementById('fn')?.value?.trim()||'untitled';if(editId){const idx=pastes.findIndex(f=>f.id===editId);if(idx!==-1){pastes[idx]={...pastes[idx],name:n,content:c,updated:Date.now()};t('Updated #'+editId,'ok')}editId=null}else{const id=gn();pastes.push({id,name:n,content:c,created:Date.now(),updated:Date.now()});t('Created #'+id,'ok')}sd();const url=window.location.href.split('?')[0]+'?p='+pastes[pastes.length-1].id;document.getElementById('shareUrl').textContent=url;document.getElementById('linkArea').style.display='block';document.getElementById('cd').value='';r()}
function lf(id){const f=pastes.find(x=>x.id===id);if(!f)return;editId=id;document.getElementById('cd').value=f.content;document.getElementById('linkArea').style.display='none';t('Loaded #'+id,'inf')}
function df(id){if(!confirm('Delete #'+id+'?'))return;pastes=pastes.filter(x=>x.id!==id);sd();if(editId===id){editId=null;document.getElementById('linkArea').style.display='none'}t('Deleted','err')}
function cl(){if(document.getElementById('cd').value&&!confirm('Clear?'))return;document.getElementById('cd').value='';editId=null;document.getElementById('linkArea').style.display='none';t('Cleared','inf')}
function cp(){const c=document.getElementById('cd').value;if(!c){t('Empty!','err');return}navigator.clipboard?.writeText(c).then(()=>t('Copied!','ok')).catch(()=>{const ta=document.createElement('textarea');ta.value=c;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();t('Copied!','ok')})}
function dl(){const c=document.getElementById('cd').value;if(!c){t('Empty!','err');return}const blob=new Blob([c],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='paste.txt';a.click();URL.revokeObjectURL(a.href);t('Downloaded','ok')}
function cs(){const url=document.getElementById('shareUrl').textContent;if(!url||url==='...'){t('No link!','err');return}navigator.clipboard?.writeText(url).then(()=>t('Link copied!','ok')).catch(()=>{const ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();t('Link copied!','ok')})}
function t(msg,type='inf'){const box=document.getElementById('ts');const el=document.createElement('div');el.className='toast '+type;const ic={ok:'✅',err:'❌',inf:'ℹ️'};el.innerHTML=ic[type]+' '+msg;box.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(30px)';el.style.transition='0.3s';setTimeout(()=>el.remove(),300)},2000)}
function lfu(){const p=new URLSearchParams(window.location.search);const id=p.get('p');if(id){const f=pastes.find(x=>x.id===parseInt(id));if(f){document.getElementById('cd').value=f.content;t('Loaded #'+f.id,'ok');window.history.replaceState({},document.title,window.location.pathname)}}}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();sv()}if(e.key==='Escape'){document.getElementById('linkArea').style.display='none'}});
ld();lfu();
</script>
</body>
    </html>
