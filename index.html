<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 CodeBin</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        .wrap { max-width: 1200px; margin:0 auto; }

        /* HEADER */
        .head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #1a1a1a;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .head .logo { font-size: 22px; font-weight: 700; }
        .head .logo span { color: #7c5cfc; }
        .head .info { display: flex; gap: 18px; font-size: 13px; color: #888; }
        .head .info b { color: #eee; }
        .head .user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }
        .head .user .badge {
            background: #2a2a2a;
            padding: 4px 12px;
            border-radius: 20px;
            color: #aaa;
            font-size: 12px;
        }
        .btn {
            padding: 6px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: 0.2s;
            font-family: inherit;
        }
        .btn-primary { background: #7c5cfc; color: #fff; }
        .btn-primary:hover { background: #6a4ae8; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-danger:hover { background: #c0392b; }
        .btn-outline { background: transparent; border: 1px solid #444; color: #ccc; }
        .btn-outline:hover { background: #2a2a2a; }

        /* GRID */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }

        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            overflow: hidden;
        }
        .card-head {
            padding: 12px 16px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 14px;
            background: #151515;
        }
        .card-head i { color: #7c5cfc; margin-right: 6px; }
        .card-body { padding: 16px; }

        /* FORM */
        .row2 {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }
        @media (max-width: 500px) { .row2 { grid-template-columns: 1fr; } }
        .field label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
        }
        .field input {
            width: 100%;
            padding: 10px 14px;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #eee;
            font-size: 14px;
            font-family: inherit;
            transition: 0.2s;
        }
        .field input:focus {
            outline: none;
            border-color: #7c5cfc;
            box-shadow: 0 0 0 3px rgba(124,92,252,0.15);
        }

        .idbox {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 14px;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            height: 42px;
        }
        .idbox .n { font-size: 24px; font-weight: 700; color: #7c5cfc; }
        .idbox .s {
            font-size: 11px;
            padding: 2px 12px;
            border-radius: 12px;
            margin-left: auto;
            background: rgba(0,200,150,0.15);
            color: #00c896;
        }
        .idbox .s.lock { background: rgba(231,76,60,0.15); color: #e74c3c; }
        .idbox .s.edit { background: rgba(252,196,60,0.15); color: #fcc43c; }

        textarea {
            width: 100%;
            min-height: 340px;
            padding: 14px;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #eee;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.7;
            resize: vertical;
            transition: 0.2s;
        }
        textarea:focus {
            outline: none;
            border-color: #7c5cfc;
            box-shadow: 0 0 0 3px rgba(124,92,252,0.1);
        }
        textarea:disabled { opacity: 0.4; cursor: not-allowed; }
        textarea::placeholder { color: #555; }

        .bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .bar button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }
        .bar button:disabled { opacity: 0.3; cursor: not-allowed; }
        .bar .sv { background: #7c5cfc; color: #fff; }
        .bar .sv:hover:not(:disabled) { background: #6a4ae8; }
        .bar .cp { background: #2a2a2a; color: #ccc; }
        .bar .cp:hover:not(:disabled) { background: #3a3a3a; }
        .bar .dl { background: #00c896; color: #fff; }
        .bar .dl:hover:not(:disabled) { background: #00b886; }
        .bar .sh { background: #fcc43c; color: #0d0d0d; }
        .bar .sh:hover:not(:disabled) { background: #f5b820; }
        .bar .rm { background: #e74c3c; color: #fff; }
        .bar .rm:hover:not(:disabled) { background: #c0392b; }

        /* FILE LIST */
        .flist { max-height: 380px; overflow-y: auto; }
        .flist::-webkit-scrollbar { width: 4px; }
        .flist::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }

        .item {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 1px solid #1a1a1a;
            gap: 12px;
            cursor: pointer;
            transition: 0.15s;
        }
        .item:hover { background: rgba(255,255,255,0.03); }
        .item .ic { font-size: 20px; width: 32px; text-align: center; }
        .item .inf { flex: 1; min-width:0; }
        .item .inf .nm { font-size: 14px; font-weight: 500; }
        .item .inf .mt {
            font-size: 11px;
            color: #666;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .item .inf .mt .id { color: #7c5cfc; font-weight: 600; }
        .item .inf .mt .rw {
            color: #00c896;
            text-decoration: none;
        }
        .item .inf .mt .rw:hover { text-decoration: underline; }
        .item .act { display: flex; gap: 4px; }
        .item .act button {
            padding: 2px 8px;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: #666;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .item .act button:hover { color: #eee; }
        .item .act .xd:hover { color: #e74c3c; }

        .empty {
            text-align: center;
            padding: 40px 16px;
            color: #555;
            font-size: 14px;
        }
        .empty i { font-size: 36px; opacity: 0.2; display: block; margin-bottom: 10px; }

        /* TOAST */
        .toasts {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .toast {
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            animation: pop 0.25s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast.ok { border-color: #00c896; color: #00c896; }
        .toast.err { border-color: #e74c3c; color: #e74c3c; }
        .toast.inf { border-color: #7c5cfc; color: #7c5cfc; }
        @keyframes pop {
            from { transform: translateX(30px); opacity:0; }
            to { transform: translateX(0); opacity:1; }
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            inset:0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index:99;
            justify-content:center;
            align-items:center;
        }
        .modal.active { display:flex; }
        .modal-box {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 28px;
            max-width:420px;
            width:95%;
        }
        .modal-box h3 { font-size:20px; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
        .modal-box h3 i { color:#7c5cfc; }
        .modal-box input {
            width:100%;
            padding:12px 14px;
            background:#0d0d0d;
            border:1px solid #2a2a2a;
            border-radius:8px;
            color:#eee;
            font-size:14px;
            font-family:inherit;
            margin-bottom:10px;
        }
        .modal-box input:focus { outline:none; border-color:#7c5cfc; }
        .modal-box .err { color:#e74c3c; font-size:13px; margin-bottom:10px; display:none; }
        .modal-box .err.show { display:block; }
        .modal-box .mact { display:flex; gap:10px; }
        .modal-box .mact button { flex:1; padding:10px; border:none; border-radius:8px; font-weight:600; cursor:pointer; font-size:14px; font-family:inherit; }
        .modal-box .mact .cl { background:#2a2a2a; color:#ccc; }
        .modal-box .mact .cl:hover { background:#3a3a3a; }
        .modal-box .mact .lg { background:#7c5cfc; color:#fff; }
        .modal-box .mact .lg:hover { background:#6a4ae8; }

        .modal-box .url {
            background:#0d0d0d;
            padding:10px 14px;
            border-radius:8px;
            font-size:12px;
            color:#7c5cfc;
            word-break:break-all;
            border:1px solid #2a2a2a;
            margin:8px 0 12px 0;
            font-family:monospace;
        }
        .modal-box .sact { display:flex; gap:8px; justify-content:flex-end; }
        .modal-box .sact button { padding:8px 18px; border:none; border-radius:8px; font-weight:600; cursor:pointer; font-size:13px; font-family:inherit; }
        .modal-box .sact .copy { background:#7c5cfc; color:#fff; }
        .modal-box .sact .copy:hover { background:#6a4ae8; }
        .modal-box .sact .close { background:#2a2a2a; color:#ccc; }
        .modal-box .sact .close:hover { background:#3a3a3a; }
    </style>
</head>
<body>

<div class="wrap">

    <!-- HEADER -->
    <div class="head">
        <div class="logo">📦 <span>CodeBin</span></div>
        <div class="info">
            <span>📄 <b id="total">0</b></span>
            <span>🔢 Next: <b id="next">1</b></span>
        </div>
        <div class="user">
            <span class="badge" id="userBadge">👤 Guest</span>
            <button class="btn btn-primary" id="loginBtn" onclick="openLogin()">Login</button>
            <button class="btn btn-danger" id="logoutBtn" onclick="logout()" style="display:none;">Logout</button>
        </div>
    </div>

    <!-- GRID -->
    <div class="grid">

        <!-- EDITOR -->
        <div class="card">
            <div class="card-head"><i>✏️</i> Editor <span style="font-weight:400;color:#666;font-size:12px;" id="charCount">0 chars</span></div>
            <div class="card-body">
                <div class="row2">
                    <div class="field">
                        <label>📁 File name</label>
                        <input type="text" id="fname" value="script.lua" placeholder="ten_file.lua">
                    </div>
                    <div class="field">
                        <label>🔢 ID</label>
                        <div class="idbox">
                            <span class="n" id="idNum">1</span>
                            <span class="s" id="idStatus">✅ Free</span>
                        </div>
                    </div>
                </div>

                <textarea id="code" placeholder="Paste your code here..."></textarea>

                <div class="bar">
                    <button class="sv" id="btnSave" onclick="save()">💾 Save</button>
                    <button class="cp" onclick="copyCode()">📋 Copy</button>
                    <button class="dl" onclick="download()">⬇️ Download</button>
                    <button class="sh" onclick="share()">🔗 Share</button>
                    <button class="rm" onclick="clearAll()">🗑️ Clear</button>
                </div>
            </div>
        </div>

        <!-- FILE LIST -->
        <div class="card">
            <div class="card-head">
                <i>📋</i> Files
                <button onclick="deleteAll()" style="background:transparent;border:none;color:#e74c3c;cursor:pointer;font-size:12px;">🗑️ All</button>
            </div>
            <div class="card-body" style="padding:0;">
                <div class="flist" id="fileList">
                    <div class="empty"><i>📭</i> No files yet</div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- LOGIN MODAL -->
<div class="modal" id="loginModal">
    <div class="modal-box">
        <h3><i>🔐</i> Login</h3>
        <input type="email" id="loginEmail" placeholder="Email" value="admin@codebin.com">
        <input type="password" id="loginPass" placeholder="Password" value="123456">
        <div class="err" id="loginErr">❌ Wrong email or password!</div>
        <div class="mact">
            <button class="cl" onclick="closeLogin()">Cancel</button>
            <button class="lg" onclick="doLogin()">🔑 Login</button>
        </div>
    </div>
</div>

<!-- SHARE MODAL -->
<div class="modal" id="shareModal">
    <div class="modal-box">
        <h3><i>🔗</i> Share Link</h3>
        <div class="url" id="shareUrl">Loading...</div>
        <div class="sact">
            <button class="copy" onclick="copyShare()">📋 Copy</button>
            <button class="close" onclick="closeShare()">Close</button>
        </div>
    </div>
</div>

<!-- TOASTS -->
<div class="toasts" id="toasts"></div>

<script>
// ============================
// DATA
// ============================
let files = [];
let editingId = null;
let currentUser = null;

const USERS = {
    'admin@codebin.com': { password: '123456', name: 'Admin' }
};

// ============================
// AUTH
// ============================
function getDeviceId() {
    let id = localStorage.getItem('did');
    if (!id) {
        id = 'd_' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
        localStorage.setItem('did', id);
    }
    return id;
}

function getUser() {
    try {
        const d = localStorage.getItem('cb_user');
        return d ? JSON.parse(d) : null;
    } catch { return null; }
}

function saveUser(u) {
    localStorage.setItem('cb_user', JSON.stringify(u));
    currentUser = u;
    renderUI();
}

function logout() {
    if (!confirm('Logout?')) return;
    localStorage.removeItem('cb_user');
    currentUser = null;
    renderUI();
    toast('👋 Logged out', 'inf');
}

function openLogin() {
    document.getElementById('loginModal').classList.add('active');
    document.getElementById('loginErr').classList.remove('show');
}

function closeLogin() {
    document.getElementById('loginModal').classList.remove('active');
}

function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value.trim();
    if (!email || !pass) {
        document.getElementById('loginErr').textContent = '❌ Please enter email and password!';
        document.getElementById('loginErr').classList.add('show');
        return;
    }
    const u = USERS[email];
    if (!u || u.password !== pass) {
        document.getElementById('loginErr').textContent = '❌ Wrong email or password!';
        document.getElementById('loginErr').classList.add('show');
        return;
    }
    saveUser({ email, name: u.name || email.split('@')[0] });
    closeLogin();
    toast('✅ Logged in as ' + u.name, 'ok');
    renderUI();
}

function renderUI() {
    const user = getUser();
    currentUser = user;
    const badge = document.getElementById('userBadge');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const ta = document.getElementById('code');
    const saveBtn = document.getElementById('btnSave');

    if (user) {
        badge.textContent = '👤 ' + user.name;
        loginBtn.style.display = 'none';
        logoutBtn.style.display = 'inline-block';
        ta.disabled = false;
        saveBtn.disabled = false;
        document.querySelectorAll('.bar button').forEach(b => b.disabled = false);
    } else {
        badge.textContent = '👤 Guest (' + getDeviceId().slice(0,8) + ')';
        loginBtn.style.display = 'inline-block';
        logoutBtn.style.display = 'none';
        ta.disabled = true;
        saveBtn.disabled = true;
        document.querySelectorAll('.bar button:not(.cp):not(.dl):not(.sh)').forEach(b => b.disabled = true);
    }
    render();
}

// ============================
// STORAGE
// ============================
function loadData() {
    try {
        const d = localStorage.getItem('cb_files');
        if (d) files = JSON.parse(d);
    } catch { files = []; }
    render();
}

function saveData() {
    localStorage.setItem('cb_files', JSON.stringify(files));
    render();
}

// ============================
// ID
// ============================
function getNextId() {
    if (!files.length) return 1;
    const ids = files.map(f => f.id).sort((a,b) => a-b);
    let n = 1;
    for (const id of ids) {
        if (id === n) n++;
        else break;
    }
    return n;
}

function updateId() {
    const n = getNextId();
    document.getElementById('idNum').textContent = n;
    document.getElementById('next').textContent = n;
    const st = document.getElementById('idStatus');
    if (!currentUser) {
        st.textContent = '🔒 Read Only';
        st.className = 's lock';
    } else if (editingId) {
        st.textContent = '✏️ #' + editingId;
        st.className = 's edit';
    } else {
        st.textContent = '✅ Free';
        st.className = 's';
    }
}

// ============================
// RENDER
// ============================
function render() {
    const list = document.getElementById('fileList');
    document.getElementById('total').textContent = files.length;
    updateId();
    document.getElementById('charCount').textContent = document.getElementById('code').value.length + ' chars';

    if (!files.length) {
        list.innerHTML = `<div class="empty"><i>📭</i> No files yet</div>`;
        return;
    }

    const sorted = [...files].sort((a,b) => b.id - a.id);
    list.innerHTML = sorted.map(f => `
        <div class="item" onclick="load(${f.id})">
            <div class="ic">${icon(f.name)}</div>
            <div class="inf">
                <div class="nm">${esc(f.name)}</div>
                <div class="mt">
                    <span class="id">#${f.id}</span>
                    <span>${new Date(f.updated || f.created).toLocaleDateString()}</span>
                    <span>${(f.content||'').length} chars</span>
                    <span><a href="/raw/${f.id}/${f.name}" target="_blank" class="rw">🔗 raw</a></span>
                </div>
            </div>
            <div class="act">
                <button onclick="event.stopPropagation();load(${f.id})" title="Edit">✏️</button>
                <button class="xd" onclick="event.stopPropagation();del(${f.id})" title="Delete">🗑️</button>
            </div>
        </div>
    `).join('');
}

function icon(n) {
    const e = (n||'').split('.').pop().toLowerCase();
    const m = { lua:'📜', js:'🟨', py:'🐍', html:'🌐', css:'🎨', json:'📋', txt:'📄', md:'📝', sh:'💻', go:'🐹', rs:'🦀' };
    return m[e] || '📄';
}

function esc(t) {
    const d = document.createElement('div');
    d.textContent = t;
    return d.innerHTML;
}

// ============================
// CRUD
// ============================
function save() {
    if (!currentUser) { toast('🔒 Login required!', 'err'); return; }
    const name = document.getElementById('fname').value.trim() || 'untitled.txt';
    const content = document.getElementById('code').value;
    if (!content.trim()) { toast('Content is empty!', 'err'); return; }

    if (editingId) {
        const idx = files.findIndex(f => f.id === editingId);
        if (idx !== -1) {
            files[idx] = { ...files[idx], name, content, updated: Date.now() };
            toast('✅ Updated #' + editingId, 'ok');
        }
        editingId = null;
    } else {
        const id = getNextId();
        files.push({ id, name, content, created: Date.now(), updated: Date.now() });
        toast('✅ Saved #' + id + ': ' + name, 'ok');
    }

    saveData();
    document.getElementById('code').value = '';
    document.getElementById('fname').value = 'script.lua';
    render();
}

function load(id) {
    const f = files.find(x => x.id === id);
    if (!f) return;

    if (!currentUser) {
        document.getElementById('fname').value = f.name;
        document.getElementById('code').value = f.content;
        document.getElementById('code').disabled = true;
        document.getElementById('btnSave').disabled = true;
        document.getElementById('idNum').textContent = f.id;
        document.getElementById('idStatus').textContent = '🔒 Read Only';
        document.getElementById('idStatus').className = 's lock';
        toast('📂 Viewing: ' + f.name + ' (Read Only)', 'inf');
        return;
    }

    editingId = id;
    document.getElementById('fname').value = f.name;
    document.getElementById('code').value = f.content;
    document.getElementById('code').disabled = false;
    document.getElementById('btnSave').disabled = false;
    render();
    document.getElementById('code').focus();
    toast('📂 Loaded: ' + f.name, 'inf');
}

function del(id) {
    if (!currentUser) { toast('🔒 Login required!', 'err'); return; }
    if (!confirm('Delete #' + id + '?')) return;
    const f = files.find(x => x.id === id);
    files = files.filter(x => x.id !== id);
    saveData();
    if (editingId === id) { editingId = null; render(); }
    toast('🗑️ Deleted: ' + (f?.name || 'file'), 'err');
}

function deleteAll() {
    if (!currentUser) { toast('🔒 Login required!', 'err'); return; }
    if (!files.length) return;
    if (!confirm('Delete ALL files?')) return;
    files = [];
    saveData();
    editingId = null;
    render();
    toast('🗑️ All files deleted', 'err');
}

function clearAll() {
    if (document.getElementById('code').value && !confirm('Clear editor?')) return;
    document.getElementById('code').value = '';
    document.getElementById('fname').value = 'script.lua';
    editingId = null;
    render();
    toast('🧹 Editor cleared', 'inf');
}

// ============================
// COPY
// ============================
function copyCode() {
    const c = document.getElementById('code').value;
    if (!c) { toast('Nothing to copy!', 'err'); return; }
    navigator.clipboard?.writeText(c).then(() => toast('📋 Copied!', 'ok'))
        .catch(() => {
            const ta = document.createElement('textarea');
            ta.value = c;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
            toast('📋 Copied!', 'ok');
        });
}

// ============================
// DOWNLOAD
// ============================
function download() {
    const c = document.getElementById('code').value;
    const n = document.getElementById('fname').value || 'script.txt';
    if (!c) { toast('Nothing to download!', 'err'); return; }
    const blob = new Blob([c], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = n;
    a.click();
    URL.revokeObjectURL(a.href);
    toast('⬇️ Downloaded', 'ok');
}

// ============================
// SHARE
// ============================
function share() {
    const c = document.getElementById('code').value;
    const n = document.getElementById('fname').value || 'script.txt';
    if (!c) { toast('Nothing to share!', 'err'); return; }
    const data = btoa(encodeURIComponent(JSON.stringify({ name: n, content: c })));
    const url = window.location.href.split('?')[0] + '?c=' + data;
    document.getElementById('shareUrl').textContent = url;
    document.getElementById('shareModal').classList.add('active');
}

function copyShare() {
    const url = document.getElementById('shareUrl').textContent;
    navigator.clipboard?.writeText(url).then(() => toast('🔗 Link copied!', 'ok'))
        .catch(() => {
            const ta = document.createElement('textarea');
            ta.value = url;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
            toast('🔗 Link copied!', 'ok');
        });
}

function closeShare() {
    document.getElementById('shareModal').classList.remove('active');
}

// ============================
// TOAST
// ============================
function toast(msg, type = 'inf') {
    const box = document.getElementById('toasts');
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    const icons = { ok: '✅', err: '❌', inf: 'ℹ️' };
    t.innerHTML = icons[type] + ' ' + msg;
    box.appendChild(t);
    setTimeout(() => {
        t.style.opacity = '0';
        t.style.transform = 'translateX(30px)';
        t.style.transition = '0.3s';
        setTimeout(() => t.remove(), 300);
    }, 2000);
}

// ============================
// LOAD FROM URL
// ============================
function loadFromUrl() {
    const p = new URLSearchParams(window.location.search);
    const d = p.get('c');
    if (!d) return;
    try {
        const raw = JSON.parse(decodeURIComponent(atob(d)));
        document.getElementById('fname').value = raw.name || 'shared.lua';
        document.getElementById('code').value = raw.content || '';
        toast('📂 Loaded from link!', 'ok');
        window.history.replaceState({}, document.title, window.location.pathname);
    } catch { toast('Invalid link!', 'err'); }
}

// ============================
// RAW HANDLER
// ============================
function handleRaw() {
    const path = window.location.pathname;
    const parts = path.split('/').filter(p => p);
    if (parts.length >= 2 && parts[0] === 'raw') {
        const id = parseInt(parts[1]);
        const name = parts.slice(2).join('/') || 'untitled.txt';
        let content = '';
        try {
            const d = localStorage.getItem('cb_files');
            if (d) {
                const all = JSON.parse(d);
                const f = all.find(x => x.id === id);
                if (f) content = f.content || '';
                else content = '// File #' + id + ' not found';
            } else {
                content = '// No data found';
            }
        } catch { content = '// Error loading'; }
        document.documentElement.innerHTML = `<pre style="margin:0;padding:20px;background:#0d0d0d;color:#e0e0e0;font-family:'Courier New',monospace;font-size:14px;min-height:100vh;white-space:pre-wrap;word-break:break-all;">${content}</pre>`;
        document.title = 'Raw: ' + name;
    }
}

// ============================
// KEYBOARD
// ============================
document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); }
    if (e.key === 'Escape') { closeLogin(); closeShare(); }
});

// ============================
// AUTO
// ============================
document.getElementById('code').addEventListener('input', () => {
    document.getElementById('charCount').textContent = document.getElementById('code').value.length + ' chars';
});

// ============================
// INIT
// ============================
loadData();
loadFromUrl();
handleRaw();
renderUI();
</script>
</body>
</html>
