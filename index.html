<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RawBin</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#09090b;color:#e4e4e7;font-family:system-ui,'Segoe UI',sans-serif;padding:20px;display:flex;justify-content:center}
        .w{max-width:1100px;width:100%}
        .h{display:flex;justify-content:space-between;align-items:center;background:#18181b;padding:12px 20px;border-radius:12px;border:1px solid #27272a;margin-bottom:16px;flex-wrap:wrap;gap:10px}
        .h .l{font-weight:700;font-size:20px}
        .h .l span{color:#8b5cf6}
        .h .st{display:flex;gap:16px;font-size:13px;color:#71717a}
        .h .st b{color:#f4f4f5}
        .h .u{display:flex;align-items:center;gap:8px}
        .h .u .b{padding:2px 12px;border-radius:20px;background:#27272a;font-size:12px;color:#a1a1aa}
        .btn{padding:6px 16px;border:none;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;transition:.2s}
        .btn-p{background:#8b5cf6;color:#fff}
        .btn-p:hover{background:#7c3aed}
        .btn-d{background:#ef4444;color:#fff}
        .btn-d:hover{background:#dc2626}
        .g{display:grid;grid-template-columns:1fr 1fr;gap:16px}
        @media(max-width:768px){.g{grid-template-columns:1fr}}
        .c{background:#18181b;border:1px solid #27272a;border-radius:12px;overflow:hidden}
        .ch{padding:10px 16px;border-bottom:1px solid #27272a;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;background:#18181b}
        .ch i{color:#8b5cf6;margin-right:6px}
        .cb{padding:14px}
        .r{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-bottom:10px}
        @media(max-width:500px){.r{grid-template-columns:1fr}}
        .f label{display:block;font-size:11px;font-weight:600;color:#71717a;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
        .f input{width:100%;padding:10px 14px;background:#09090b;border:1px solid #27272a;border-radius:8px;color:#f4f4f5;font-size:14px;font-family:inherit;transition:.2s;outline:none}
        .f input:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.15)}
        .idb{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#09090b;border:1px solid #27272a;border-radius:8px;height:42px}
        .idb .n{font-size:22px;font-weight:700;color:#8b5cf6}
        .idb .s{padding:2px 12px;border-radius:12px;font-size:11px;margin-left:auto;background:rgba(34,197,94,.15);color:#22c55e}
        .idb .s.l{background:rgba(239,68,68,.15);color:#ef4444}
        .idb .s.e{background:rgba(234,179,8,.15);color:#eab308}
        textarea{width:100%;min-height:320px;padding:14px;background:#09090b;border:1px solid #27272a;border-radius:8px;color:#f4f4f5;font-family:'Courier New',monospace;font-size:13px;line-height:1.7;resize:vertical;transition:.2s;outline:none}
        textarea:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.1)}
        textarea:disabled{opacity:.4;cursor:not-allowed}
        .tb{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
        .tb button{padding:8px 16px;border:none;border-radius:8px;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;transition:.2s;display:flex;align-items:center;gap:6px}
        .tb button:disabled{opacity:.3;cursor:not-allowed}
        .tb .sv{background:#8b5cf6;color:#fff}
        .tb .sv:hover:not(:disabled){background:#7c3aed}
        .tb .cp{background:#27272a;color:#e4e4e7}
        .tb .cp:hover:not(:disabled){background:#3f3f46}
        .tb .dl{background:#22c55e;color:#fff}
        .tb .dl:hover:not(:disabled){background:#16a34a}
        .tb .sh{background:#eab308;color:#09090b}
        .tb .sh:hover:not(:disabled){background:#ca8a04}
        .tb .rm{background:#ef4444;color:#fff}
        .tb .rm:hover:not(:disabled){background:#dc2626}
        .fl{max-height:380px;overflow-y:auto}
        .fl::-webkit-scrollbar{width:4px}
        .fl::-webkit-scrollbar-thumb{background:#27272a;border-radius:4px}
        .it{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid #18181b;gap:12px;cursor:pointer;transition:.15s}
        .it:hover{background:rgba(255,255,255,.02)}
        .it .ic{font-size:20px;width:32px;text-align:center}
        .it .in{flex:1;min-width:0}
        .it .in .nm{font-size:14px;font-weight:500}
        .it .in .mt{font-size:11px;color:#71717a;display:flex;gap:12px;flex-wrap:wrap}
        .it .in .mt .id{color:#8b5cf6;font-weight:600}
        .it .in .mt .rw{color:#22c55e;text-decoration:none}
        .it .in .mt .rw:hover{text-decoration:underline}
        .it .ac{display:flex;gap:4px}
        .it .ac button{padding:2px 8px;border:none;border-radius:4px;background:0 0;color:#71717a;cursor:pointer;font-size:13px;transition:.2s}
        .it .ac button:hover{color:#f4f4f5}
        .it .ac .x:hover{color:#ef4444}
        .e{text-align:center;padding:40px 16px;color:#71717a;font-size:14px}
        .e i{font-size:36px;opacity:.2;display:block;margin-bottom:10px}
        .toasts{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:6px}
        .toast{padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;background:#18181b;border:1px solid #27272a;animation:p .25s ease;display:flex;align-items:center;gap:8px}
        .toast.ok{border-color:#22c55e;color:#22c55e}
        .toast.err{border-color:#ef4444;color:#ef4444}
        .toast.inf{border-color:#8b5cf6;color:#8b5cf6}
        @keyframes p{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
        .m{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:99;justify-content:center;align-items:center}
        .m.a{display:flex}
        .mb{background:#18181b;border:1px solid #27272a;border-radius:16px;padding:28px;max-width:420px;width:95%}
        .mb h3{font-size:20px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
        .mb h3 i{color:#8b5cf6}
        .mb input{width:100%;padding:12px 14px;background:#09090b;border:1px solid #27272a;border-radius:8px;color:#f4f4f5;font-size:14px;font-family:inherit;margin-bottom:10px;outline:none}
        .mb input:focus{border-color:#8b5cf6}
        .mb .er{color:#ef4444;font-size:13px;margin-bottom:10px;display:none}
        .mb .er.s{display:block}
        .mb .ma{display:flex;gap:10px}
        .mb .ma button{flex:1;padding:10px;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;font-family:inherit}
        .mb .ma .cl{background:#27272a;color:#e4e4e7}
        .mb .ma .cl:hover{background:#3f3f46}
        .mb .ma .lg{background:#8b5cf6;color:#fff}
        .mb .ma .lg:hover{background:#7c3aed}
        .mb .url{background:#09090b;padding:10px 14px;border-radius:8px;font-size:12px;color:#8b5cf6;word-break:break-all;border:1px solid #27272a;margin:8px 0 12px;font-family:monospace}
        .mb .sa{display:flex;gap:8px;justify-content:flex-end}
        .mb .sa button{padding:8px 18px;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;font-family:inherit}
        .mb .sa .copy{background:#8b5cf6;color:#fff}
        .mb .sa .copy:hover{background:#7c3aed}
        .mb .sa .cls{background:#27272a;color:#e4e4e7}
        .mb .sa .cls:hover{background:#3f3f46}
    </style>
</head>
<body>
<div class="w">

<div class="h">
    <div class="l">⚡<span>Bin</span></div>
    <div class="st"><span>📄 <b id="t">0</b></span><span>🔢 <b id="nx">1</b></span></div>
    <div class="u"><span class="b" id="ub">👤 Guest</span><button class="btn btn-p" id="lbi" onclick="ol()">Login</button><button class="btn btn-d" id="lbo" onclick="lo()" style="display:none">Logout</button></div>
</div>

<div class="g">
<div class="c">
<div class="ch">✏️ Editor <span style="font-weight:400;color:#71717a;font-size:12px" id="cc">0 chars</span></div>
<div class="cb">
<div class="r">
<div class="f"><label>📁 File</label><input type="text" id="fn" value="script.lua"></div>
<div class="f"><label>🔢 ID</label><div class="idb"><span class="n" id="idn">1</span><span class="s" id="ids">✅ Free</span></div></div>
</div>
<textarea id="cd" placeholder="Paste code..."></textarea>
<div class="tb">
    <button class="sv" id="bsv" onclick="sv()">💾 Save</button>
    <button class="cp" onclick="cp()">📋 Copy</button>
    <button class="dl" onclick="dl()">⬇️ Download</button>
    <button class="sh" onclick="sh()">🔗 Share</button>
    <button class="rm" onclick="cl()">🗑️ Clear</button>
</div>
</div>
</div>

<div class="c">
<div class="ch">📋 Files <button onclick="da()" style="background:0 0;border:none;color:#ef4444;cursor:pointer;font-size:12px">🗑️ All</button></div>
<div class="cb" style="padding:0"><div class="fl" id="fl"><div class="e"><i>📭</i> No files</div></div></div>
</div>
</div>
</div>

<div class="m" id="lm"><div class="mb"><h3>🔐 Login</h3><input type="email" id="le" placeholder="Email" value="admin@codebin.com"><input type="password" id="lp" placeholder="Password" value="123456"><div class="er" id="ler">❌ Wrong</div><div class="ma"><button class="cl" onclick="clm()">Cancel</button><button class="lg" onclick="dol()">🔑 Login</button></div></div></div>
<div class="m" id="sm"><div class="mb"><h3>🔗 Share</h3><div class="url" id="su">...</div><div class="sa"><button class="copy" onclick="cs()">📋 Copy</button><button class="cls" onclick="csm()">Close</button></div></div></div>
<div class="toasts" id="ts"></div>

<script>
let files=[],eid=null,cu=null;
const USERS={'admin@codebin.com':{password:'123456',name:'Admin'}};

function gid(){let a=localStorage.getItem('did');if(!a){a='d_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);localStorage.setItem('did',a)}return a}
function gu(){try{let a=localStorage.getItem('cb_user');return a?JSON.parse(a):null}catch{return null}}
function su(u){localStorage.setItem('cb_user',JSON.stringify(u));cu=u;rUI()}
function lo(){if(!confirm('Logout?'))return;localStorage.removeItem('cb_user');cu=null;rUI();t('👋 Logged out','inf')}
function ol(){document.getElementById('lm').classList.add('a');document.getElementById('ler').classList.remove('s')}
function clm(){document.getElementById('lm').classList.remove('a')}
function dol(){let e=document.getElementById('le').value.trim(),p=document.getElementById('lp').value.trim();if(!e||!p){document.getElementById('ler').textContent='❌ Please fill all';document.getElementById('ler').classList.add('s');return}let u=USERS[e];if(!u||u.password!==p){document.getElementById('ler').textContent='❌ Wrong email/password';document.getElementById('ler').classList.add('s');return}su({email:e,name:u.name||e.split('@')[0]});clm();t('✅ Logged in as '+u.name,'ok');rUI()}
function rUI(){let u=gu();cu=u;document.getElementById('ub').textContent=u?'👤 '+u.name:'👤 Guest ('+gid().slice(0,8)+')';document.getElementById('lbi').style.display=u?'none':'inline-block';document.getElementById('lbo').style.display=u?'inline-block':'none';let ta=document.getElementById('cd'),sv=document.getElementById('bsv');if(u){ta.disabled=false;sv.disabled=false;document.querySelectorAll('.tb button').forEach(b=>b.disabled=false)}else{ta.disabled=true;sv.disabled=true;document.querySelectorAll('.tb button:not(.cp):not(.dl):not(.sh)').forEach(b=>b.disabled=true)}r()}
function ld(){try{let a=localStorage.getItem('cb_files');if(a)files=JSON.parse(a)}catch{}r()}
function sd(){localStorage.setItem('cb_files',JSON.stringify(files));r()}
function gn(){if(!files.length)return 1;let a=files.map(f=>f.id).sort((a,b)=>a-b),n=1;for(let i of a){if(i===n)n++;else break}return n}
function ui(){let n=gn();document.getElementById('idn').textContent=n;document.getElementById('nx').textContent=n;let st=document.getElementById('ids');if(!cu){st.textContent='🔒 Read Only';st.className='s l'}else if(eid){st.textContent='✏️ #'+eid;st.className='s e'}else{st.textContent='✅ Free';st.className='s'}}
function r(){let list=document.getElementById('fl');document.getElementById('t').textContent=files.length;ui();document.getElementById('cc').textContent=document.getElementById('cd').value.length+' chars';if(!files.length){list.innerHTML='<div class="e"><i>📭</i> No files</div>';return}let s=[...files].sort((a,b)=>b.id-a.id);list.innerHTML=s.map(f=>`<div class="it" onclick="ldf(${f.id})"><div class="ic">${icn(f.name)}</div><div class="in"><div class="nm">${esc(f.name)}</div><div class="mt"><span class="id">#${f.id}</span><span>${new Date(f.updated||f.created).toLocaleDateString()}</span><span>${(f.content||'').length} chars</span><span><a href="/raw/${f.id}/${f.name}" target="_blank" class="rw">🔗 raw</a></span></div></div><div class="ac"><button onclick="event.stopPropagation();ldf(${f.id})">✏️</button><button class="x" onclick="event.stopPropagation();dlf(${f.id})">🗑️</button></div></div>`).join('')}
function icn(n){let e=(n||'').split('.').pop().toLowerCase();let m={lua:'📜',js:'🟨',py:'🐍',html:'🌐',css:'🎨',json:'📋',txt:'📄',md:'📝',sh:'💻',go:'🐹',rs:'🦀'};return m[e]||'📄'}
function esc(t){let d=document.createElement('div');d.textContent=t;return d.innerHTML}
function sv(){if(!cu){t('🔒 Login required!','err');return}let n=document.getElementById('fn').value.trim()||'untitled.txt',c=document.getElementById('cd').value;if(!c.trim()){t('Content empty!','err');return}if(eid){let i=files.findIndex(f=>f.id===eid);if(i!==-1){files[i]={...files[i],name:n,content:c,updated:Date.now()};t('✅ Updated #'+eid,'ok')}eid=null}else{let id=gn();files.push({id,name:n,content:c,created:Date.now(),updated:Date.now()});t('✅ Saved #'+id+': '+n,'ok')}sd();document.getElementById('cd').value='';document.getElementById('fn').value='script.lua';r()}
function ldf(id){let f=files.find(x=>x.id===id);if(!f)return;if(!cu){document.getElementById('fn').value=f.name;document.getElementById('cd').value=f.content;document.getElementById('cd').disabled=true;document.getElementById('bsv').disabled=true;document.getElementById('idn').textContent=f.id;document.getElementById('ids').textContent='🔒 Read Only';document.getElementById('ids').className='s l';t('📂 Viewing: '+f.name,'inf');return}eid=id;document.getElementById('fn').value=f.name;document.getElementById('cd').value=f.content;document.getElementById('cd').disabled=false;document.getElementById('bsv').disabled=false;r();document.getElementById('cd').focus();t('📂 Loaded: '+f.name,'inf')}
function dlf(id){if(!cu){t('🔒 Login required!','err');return}if(!confirm('Delete #'+id+'?'))return;let f=files.find(x=>x.id===id);files=files.filter(x=>x.id!==id);sd();if(eid===id){eid=null;r()}t('🗑️ Deleted: '+(f?.name||'file'),'err')}
function da(){if(!cu){t('🔒 Login required!','err');return}if(!files.length)return;if(!confirm('Delete ALL?'))return;files=[];sd();eid=null;r();t('🗑️ All deleted','err')}
function cl(){if(document.getElementById('cd').value&&!confirm('Clear editor?'))return;document.getElementById('cd').value='';document.getElementById('fn').value='script.lua';eid=null;r();t('🧹 Cleared','inf')}
function cp(){let c=document.getElementById('cd').value;if(!c){t('Nothing to copy!','err');return}navigator.clipboard?.writeText(c).then(()=>t('📋 Copied!','ok')).catch(()=>{let ta=document.createElement('textarea');ta.value=c;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();t('📋 Copied!','ok')})}
function dl(){let c=document.getElementById('cd').value,n=document.getElementById('fn').value||'script.txt';if(!c){t('Nothing to download!','err');return}let blob=new Blob([c],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=n;a.click();URL.revokeObjectURL(a.href);t('⬇️ Downloaded','ok')}
function sh(){let c=document.getElementById('cd').value,n=document.getElementById('fn').value||'script.txt';if(!c){t('Nothing to share!','err');return}let d=btoa(encodeURIComponent(JSON.stringify({name:n,content:c}))),u=window.location.href.split('?')[0]+'?c='+d;document.getElementById('su').textContent=u;document.getElementById('sm').classList.add('a')}
function cs(){let u=document.getElementById('su').textContent;navigator.clipboard?.writeText(u).then(()=>t('🔗 Link copied!','ok')).catch(()=>{let ta=document.createElement('textarea');ta.value=u;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();t('🔗 Link copied!','ok')})}
function csm(){document.getElementById('sm').classList.remove('a')}
function t(msg,type='inf'){let box=document.getElementById('ts'),el=document.createElement('div');el.className='toast '+type;let ic={ok:'✅',err:'❌',inf:'ℹ️'};el.innerHTML=ic[type]+' '+msg;box.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(30px)';el.style.transition='.3s';setTimeout(()=>el.remove(),300)},2000)}
function lfu(){let p=new URLSearchParams(window.location.search),d=p.get('c');if(!d)return;try{let raw=JSON.parse(decodeURIComponent(atob(d)));document.getElementById('fn').value=raw.name||'shared.lua';document.getElementById('cd').value=raw.content||'';t('📂 Loaded from link!','ok');window.history.replaceState({},document.title,window.location.pathname)}catch{t('Invalid link!','err')}}
function hr(){let p=window.location.pathname,ps=p.split('/').filter(a=>a);if(ps.length>=2&&ps[0]==='raw'){let id=parseInt(ps[1]),name=ps.slice(2).join('/')||'untitled.txt',content='';try{let d=localStorage.getItem('cb_files');if(d){let all=JSON.parse(d),f=all.find(x=>x.id===id);if(f)content=f.content||'';else content='// File #'+id+' not found'}else content='// No data'}catch{}document.documentElement.innerHTML='<pre style="margin:0;padding:20px;background:#09090b;color:#e4e4e7;font-family:Courier New,monospace;font-size:14px;min-height:100vh;white-space:pre-wrap;word-break:break-all;">'+content+'</pre>';document.title='Raw: '+name}}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();sv()}if(e.key==='Escape'){clm();csm()}});
document.getElementById('cd').addEventListener('input',()=>{document.getElementById('cc').textContent=document.getElementById('cd').value.length+' chars'});
ld();lfu();hr();rUI();
</script>
</body>
  </html>
